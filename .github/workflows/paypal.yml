name: Check PayPal
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read new PayPal payments
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/paypal" \
            -H "x-sync-token: ${{ secrets.PAYPAL_SYNC_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{}'
